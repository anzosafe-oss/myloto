function rng(value){let x=value>>>0;return ()=>{x=(x+0x6D2B79F5)|0;let t=Math.imul(x^(x>>>15),x|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}

function tree(rows,depth,random){
 const mean=rows.reduce((s,r)=>s+r.y,0)/rows.length;
 if(!depth||rows.length<48)return ()=>mean;

 }

function predict(code,p,date,modelSeed=seed){

 card('<h2>Matricea perechilor</h2><div class="scroll"><div class="matrix">'+numbers.map(a=>numbers.map(b=>{const c=p.get([a,b].sort((x,y)=>x-y).join('–'))||0;return '<button style="--v:'+c/pm+'" data-info="'+a+' și '+b+' · '+c+' coapariții" title="'+a+' și '+b+' · '+c+'"></button>';}).join('')).join('')+'</div></div><small id="heatInfo">Rânduri și coloane de la 1 la 40.</small>')+
 '<div class="grid wide">'+card('<h2>Perechi</h2>'+table(['Numere','Apariții'],top(p)))+card('<h2>Triplete</h2>'+table(['Numere','Apariții'],top(t)))+card('<h2>Pare și impare</h2>'+table(['Pare','Impare','Extrageri'],ev.map((n,i)=>[i,state.metric-i,n])))+card('<h2>Intervale</h2>'+table(['Interval','Apariții'],bins.map((n,i)=>[(i*10+1)+'–'+(i+1)*10,n])))+'</div></div>';
}
function algorithms(){
 return header('Algoritmi','Versiuni, parametri și rezultate pentru cele 16 metode.')+'<div class="grid wide">'+methods.map(m=>{const r=state.result?.results.find(x=>x.id===m.id);
 return card('<div class="listline"><h3>'+m.id+' · '+m.name+'</h3><label><input type="checkbox" data-algo="'+m.id+'" '+(state.active[m.id]?'checked':'')+' '+(m.id==='A00'?'disabled':'')+'> Activ</label></div><p>'+m.description+'</p><small>'+m.params+' · v'+m.version+(m.experimental?' · Experimental, eșantion redus':'')+'</small>'+(r?'<p>Test '+dec(r.mean[0])+' / '+dec(r.mean[1])+' potriviri</p>':''));
 }).join('')+'</div>';
}
function summary(result){
 const rs=result.results;
 return table(['Metodă','N','Medie 5 / 6','Δ vs A00','IC 95% · 5 / 6','p Holm · 5 / 6','Ultimele 10 / 20 / 50 · 5 / 6','Distribuție 0–5 · 5 / 6'],rs.map(r=>[r.id,r.n,r.mean.map(x=>dec(x)).join(' / '),r.delta.map(x=>dec(x)).join(' / '),r.ci.map(a=>a.map(x=>dec(x)).join('–')).join(' / '),r.adjusted.map(x=>dec(x,4)).join(' / '),r.recent.map(a=>a.map(x=>dec(x)).join(' / ')).join(' · '),r.dist.map(a=>a.join(', ')).join(' / ')]));
}
function evolution(result){
 const width=700,height=185,colors=['#aee88a','#86b9ed','#f3b875','#da9bef','#f4979a'];
 const curves=result.results.map((r,i)=>{let sum=0;const n=r.points.length,color=colors[i%colors.length],points=r.points.map((p,j)=>{sum+=p.m[1];return (15+j*665/Math.max(1,n-1))+','+(170-(sum/(j+1))*29);}).join(' ');return '<g data-info="'+r.id+' · '+dec(r.mean[1])+' potriviri medii"><title>'+r.id+' · '+dec(r.mean[1])+'</title><polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+points+'"/></g>';});
 return '<div class="scroll"><svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Evoluția mediei cumulative față de toate șase numerele">'+curves.join('')+'</svg></div><small id="evoInfo">Medie cumulativă cu toate cele șase numere. Selectează o linie pentru detalii.</small>';
}
function testing(){
 const days=group(state.valid),start=days.find(d=>d.date>='2026-05-14')?.date||'',cal=days.find(d=>d.date>='2025-10-19')?.date||'',end=last()?.date||'',r=state.result;
 return header('Backtesting','Walk-forward cu fereastră de test fixată înainte de evaluare.')+'<div class="stack">'+card('<p>Antrenare inițială din '+fmt(days[0]?.date)+'; fereastră de calibrare din '+fmt(cal)+'; test din '+fmt(start)+'. Parametrii sunt fixați. Modelele se reantrenează numai cu zile anterioare.</p><form id="test" class="stack" style="margin-top:12px"><div class="actions"><label>De la<input name="from" type="date" min="'+start+'" max="'+end+'" value="'+esc(state.testFrom||start)+'" required></label><label>Până la<input name="to" type="date" min="'+start+'" max="'+end+'" value="'+esc(state.testTo||end)+'" required></label><button class="primary" '+(state.busy?'disabled':'')+'>Rulează testele</button></div><div class="chips">'+methods.map(m=>'<label><input name="codes" type="checkbox" value="'+m.id+'" '+((state.testCodes||supported().map(m=>m.id)).includes(m.id)?'checked':'')+' '+(m.id==='A00'?'disabled':'')+'>'+m.id+'</label>').join('')+'</div><progress id="progress" max="100" value="'+(state.progress||0)+'" '+(!state.busy?'hidden':'')+'></progress></form>')+
 (r?card('<div class="listline"><h2>'+fmt(r.from)+' – '+fmt(r.to)+'</h2><button data-action="saveB" '+(!state.historySynced?'disabled':'')+'>Salvează în Supabase</button></div><p>'+r.simulations.toLocaleString('ro-RO')+' simulări uniforme · seed '+r.seed+' · interval A00 95% '+r.bands.map(a=>a.map(x=>dec(x)).join('–')).join(' / ')+'</p>'+evolution(r)+summary(r)):'')+
 (state.saved.length?card('<h2>Teste salvate</h2>'+table(['Data execuției','Interval','Metode',''],state.saved.map(x=>[esc(x.at),fmt(x.data.from)+' – '+fmt(x.data.to),x.data.results.length,'<button data-action="openB" data-key="'+x.key+'">Deschide</button>']))):'')+'</div>';
}
function realRanks(from='',to='9999-12-31'){
 const a=state.predictions.filter(p=>p.status==='Evaluată'&&p.date>=from&&p.date<=to);
 return [...new Set(a.map(p=>p.id))].map(id=>{const p=a.filter(x=>x.id===id);return {id,n:p.length,mean:[avg(p.map(x=>x.m5)),avg(p.map(x=>x.m6))]};}).sort((a,b)=>b.mean[state.rankScore]-a.mean[state.rankScore]);
}
function ranking(){
 const from=state.rankFrom,to=state.rankTo||'9999-12-31',source=state.result||state.saved[0]?.data;
 const hist=source?.results.map(r=>{const p=r.points.filter(x=>x.date>=from&&x.date<=to);return {...r,n:p.length,mean:[0,1].map(k=>avg(p.map(x=>x.m[k])))};}).filter(r=>r.n).sort((a,b)=>b.mean[state.rankScore]-a.mean[state.rankScore])||[];
 const showP=source&&(!from||from<=source.from)&&to>=source.to;
 const real=realRanks(from,to),base=hist.find(x=>x.id==='A00'),realBase=real.find(x=>x.id==='A00');
 return header('Clasament','Rezultate istorice și evaluări prospective în tabele separate.')+'<div class="stack">'+card('<form class="actions" id="rankFilter"><label>De la<input name="from" type="date" value="'+esc(from)+'"></label><label>Până la<input name="to" type="date" value="'+esc(state.rankTo)+'"></label><label>Indicator<select name="score"><option value="1" '+(state.rankScore===1?'selected':'')+'>Toate șase</option><option value="0" '+(state.rankScore===0?'selected':'')+'>Primele cinci</option></select></label><button>Aplică</button></form>')+
 card('<h2>Backtesting</h2>'+(hist.length?table(['Algoritm','Extrageri','Medie','Δ vs A00','p ajustat Holm'],hist.map(r=>{const k=state.rankScore,p=showP?r.adjusted[k]:null;return [r.id,r.n,dec(r.mean[k]),dec(r.mean[k]-base.mean[k]),p!==null&&p<.05?'<strong class="warning">'+dec(p,4)+'</strong>':dec(p,4)];})):'<p>Rulează un test pentru a vedea clasamentul.</p>'))+
 card('<h2>Predicții reale</h2>'+(real.length?table(['Algoritm','Predicții','Medie','Δ descriptiv vs A00'],real.map(r=>[r.id,r.n,dec(r.mean[state.rankScore]),realBase?dec(r.mean[state.rankScore]-realBase.mean[state.rankScore]):'—'])):'<p>Nu există predicții prospective evaluate pentru acest interval.</p>'))+'</div>';
}
function generate(form){
 const {date,algorithm}=Object.fromEntries(new FormData(form));
 if(!date)throw Error('Selectează data extragerii înainte de a genera numerele.');
 if(date<today())throw Error('Selectează ziua de azi sau o dată viitoare.');
 const chosen=algorithm==='all'?supported():supported().filter(m=>m.id===algorithm);
 if(!chosen.length)throw Error('Selectează un algoritm activ.');
 const history=prepared(state.valid.filter(r=>r.date<date));
 state.draft=chosen.map(m=>({id:m.id,n:predict(m.id,history,date),version:m.version,params:m.params,seed}));
 state.target=date;
 state.algorithm=algorithm;
 flash('');
 render();
 $('#generated')?.focus();
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button,[data-info]');if(!b)return;
 if(b.dataset.tab!==undefined){state.tab=+b.dataset.tab;state.more=false;flash('');render();window.scrollTo(0,0);return;}
 if(b.dataset.info){const target=b.closest('.matrix')?$('#heatInfo'):b.closest('svg')?$('#evoInfo'):$('#chartInfo');if(target)target.textContent=b.dataset.info;return;}
 const a=b.dataset.action;if(!a)return;
 try{
 if(a==='more'){state.more=!state.more;renderMobileNav();$('#mobileNav [data-action=more]')?.focus();return;}
 if(a==='generate')generate($('#generate'));
 if(a==='logout'){
 const access=session?.access_token;
 saveSession(null);
 state.valid=[];state.excluded=[];state.drawsSynced=false;state.draft=[];state.result=null;state.predictions=[];state.tickets=[];state.saved=[];state.historySynced=false;state.tab=0;openPredictionDays.clear();
 render();flash('');
 if(access)await api('/auth/v1/logout?scope=local',{method:'POST',access}).catch(()=>{});
 }
 if(a==='refresh')await refreshData();
 if(a==='prev'||a==='next'){state.page+=a==='next'?1:-1;render();}
 if(a==='saveP'){b.disabled=true;await write('savePredictions',{date:state.target,items:state.draft});state.draft=[];render();}
 if(a==='evaluate'){b.disabled=true;await write('evaluate',{});}
 if(a==='saveB'){b.disabled=true;await write('saveBacktest',state.result);}
 if(a==='openB'){const item=state.saved.find(x=>x.key===Number(b.dataset.key));if(item){state.result=item.data;render();}}
 }catch(err){flash(err.message,true);if(a==='generate')$('#message').scrollIntoView({block:'center'});else render();}
});
document.addEventListener('change',async e=>{
 const id=e.target.dataset.algo;if(!id)return;
 const active=e.target.checked,old=state.active[id];state.active[id]=active;
 try{if(state.sync)await write('setActive',{id,active});else flash('Activarea din preview se aplică numai în sesiunea curentă.');}
 catch(err){state.active[id]=old;flash(err.message,true);render();}
});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f),id=e.target.getAttribute('id');flash('');
 try{
 if(id==='filter'){state.fx=data;state.page=0;render();}
 if(id==='statFilter'){state.window=+data.window;state.metric=+data.metric;render();}
 if(id==='rankFilter'){if(data.to&&data.from>data.to)throw Error('Interval invalid.');state.rankFrom=data.from;state.rankTo=data.to;state.rankScore=+data.score;render();}
 if(id==='login'){
 const button=e.target.querySelector('button');button.disabled=true;
 try{
 const value=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:data.email.trim(),password:data.password}});
 saveSession(value);await refresh();
 }catch(e){throw Error(e.status===400||e.status===401?'Autentificarea nu a reușit. Verifică adresa și parola contului MyGames.':e.message);}
 finally{button.disabled=false;}
 }
 if(id==='generate')generate(e.target);
 if(id==='saveTicket'){const button=e.target.querySelector('button');button.disabled=true;try{await write('saveTicket',data);}finally{button.disabled=!state.historySynced;}}
 if(id==='nextForm')await write('setNext',data);
 if(id==='addDraw'){const button=e.target.querySelector('button');button.disabled=true;try{await write('addDraw',{...data,n:data.n.trim().split(/[ ,]+/).map(Number)});}finally{button.disabled=!state.drawsSynced;}}
 if(id==='test'){
 if(state.busy)return;
 state.testFrom=data.from;state.testTo=data.to;state.testCodes=['A00',...f.getAll('codes')];state.busy=true;state.progress=0;render();
 try{state.result=await backtest(state.valid,data.from,data.to,state.testCodes,(i,n)=>{state.progress=100*i/n;const p=$('#progress');if(p)p.value=state.progress;});}
 finally{state.busy=false;render();}
 }
 }catch(err){flash(err.message,true);}
});
const iconTheme = matchMedia('(prefers-color-scheme: light)');
function updateInstallIcon(){
 $('#ios-icon').href='./icons/'+(iconTheme.matches?'light':'dark')+'-180.png';
}
updateInstallIcon();
iconTheme.addEventListener('change',updateInstallIcon);
let pullStart=null,pullDistance=0;
function indicator(message=''){
 const node=$('#refreshIndicator');node.textContent=message;node.hidden=!message;
}
let refreshToastTimer;
function refreshToast(message=''){
 clearTimeout(refreshToastTimer);
 const node=$('#refreshToast');
 node.textContent=message;node.hidden=!message;
 if(message)refreshToastTimer=setTimeout(()=>refreshToast(),2000);
}
const appVersion=$('meta[name="myloto-version"]').content;
const appReloadKey='myloto.refresh-state.v1';
function newerVersion(candidate,current){
 const valid=/^\d+\.\d+\.\d+$/;
 if(!valid.test(candidate||'')||!valid.test(current||''))return false;
 const next=candidate.split('.').map(Number),old=current.split('.').map(Number);
 const changed=next.findIndex((n,i)=>n!==old[i]);
 return changed>=0&&next[changed]>old[changed];
}
async function updateAppIfAvailable(){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);
 try{
 const url=new URL(location.href);url.hash='';url.searchParams.delete('_app');url.searchParams.delete('_reload');url.searchParams.set('_updateCheck',String(Date.now()));
 const response=await fetch(url.href,{cache:'no-store',signal:controller.signal});
 if(!response.ok)return false;
 const latest=new DOMParser().parseFromString(await response.text(),'text/html').querySelector('meta[name="myloto-version"]')?.content;
 if(!newerVersion(latest,appVersion))return false;
 const target=new URL(location.href);
 if(target.searchParams.get('_app')===latest)return false;
 try{sessionStorage.setItem(appReloadKey,JSON.stringify({tab:state.tab,openDays:[...openPredictionDays],userId:session?.user?.id,at:Date.now()}));}catch{}
 target.searchParams.delete('_updateCheck');target.searchParams.set('_app',latest);target.searchParams.set('_reload',String(Date.now()));
 indicator('Se încarcă noua versiune…');
 location.replace(target.href);return true;
 }catch{return false;}finally{clearTimeout(timer);}
}
async function refreshData(){
 if(!session||state.refreshing||state.busy)return;
 refreshToast();flash('');
 state.refreshing=true;indicator('Se actualizează…');
 let loadingUpdate=false;
 try{
 loadingUpdate=await updateAppIfAvailable();
 if(!loadingUpdate&&await refresh()&&state.historySynced)refreshToast('Actualizat');
 }finally{if(!loadingUpdate){state.refreshing=false;indicator();}}
}
function resetPull(){
 pullStart=null;pullDistance=0;if(!state.refreshing)indicator();
}
document.addEventListener('touchstart',e=>{
 resetPull();
 if(!session||state.refreshing||state.busy||window.scrollY>1||e.touches.length!==1)return;
 if(e.target.closest('input,select,textarea,button,a,.scroll,nav'))return;
 pullStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!pullStart)return;
 if(e.touches.length!==1||window.scrollY>1){resetPull();return;}
 const dx=e.touches[0].clientX-pullStart.x,dy=e.touches[0].clientY-pullStart.y;
 if(dy<0||Math.abs(dx)>Math.max(10,dy)){resetPull();return;}
 if(dy>12||pullDistance){
  pullDistance=dy;if(e.cancelable)e.preventDefault();
  indicator(dy>=80?'Eliberează pentru actualizare':'Trage în jos pentru actualizare');
 }
},{passive:false});
document.addEventListener('touchend',()=>{
 const ready=pullDistance>=80;
 resetPull();if(ready)refreshData();
},{passive:true});
document.addEventListener('touchcancel',resetPull,{passive:true});
try{
 const previous=JSON.parse(sessionStorage.getItem(appReloadKey)||'null');
 sessionStorage.removeItem(appReloadKey);
 if(session?.user?.id&&previous?.userId===session.user.id&&Date.now()-previous.at<60000){
  if(Number.isInteger(previous.tab)&&previous.tab>=0&&previous.tab<tabs.length)state.tab=previous.tab;
  for(const date of previous.openDays||[])openPredictionDays.add(date);
 }
}catch{}
render();if(session)refresh();
</script></body></html>
